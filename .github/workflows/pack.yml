# v2.37: builds the offline product pack once a month (and when you press "Run workflow" on GitHub).
# It downloads the Open Food Facts and Open Beauty Facts CSV exports, keeps the products sold in AT, BG, RO, SK (+ DE as an extra file)
# and puts the result on the branch "pack" (one commit, replaced each time, so the repo does not grow).
# The app downloads the files from https://raw.githubusercontent.com/<owner>/<repo>/pack/
name: Build product pack
on:
  schedule:
    - cron: '23 4 3 * *'      # the 3rd of each month, 04:23 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pack
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (fixed version, like checks.yml)
      - name: Download the exports (about 1 GB)
        run: |
          curl -fsSL --retry 5 --retry-delay 30 -A "label-check-pack/1 (github.com/${GITHUB_REPOSITORY})" -o off.csv.gz https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
          curl -fsSL --retry 5 --retry-delay 30 -A "label-check-pack/1 (github.com/${GITHUB_REPOSITORY})" -o obf.csv.gz https://static.openbeautyfacts.org/data/en.openbeautyfacts.org.products.csv.gz || echo "Open Beauty Facts export not available, food only"
          ls -la *.csv.gz
      - name: Check the pack builder
        run: python3 -I tools/test_pack.py
      - name: Build the packs
        run: python3 -I tools/build_pack.py off.csv.gz obf.csv.gz out
      - name: Put the packs on the branch "pack"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b pack
          git config user.name "label-check pack"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Product pack $(date -u +%Y-%m-%d) (data: Open Food Facts / Open Beauty Facts, ODbL)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pack
