# Label Check – accuracy check (by hand only: Actions > "Accuracy check" > Run workflow).
# Downloads real products from Open Food Facts (AT, DE, BG, HU, CZ, SK, SI), checks their ingredient lists with
# the app's database and compares the result with the Open Food Facts tags. Changes nothing in the app.
# The report is on the run page (Summary) and as a file to download (Artifacts: audit-report).
name: Accuracy check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download products from Open Food Facts
        run: |
          mkdir -p _audit
          FIELDS=code,lang,ingredients_text,ingredients_text_de,ingredients_text_en,ingredients_text_bg,ingredients_text_hu,ingredients_text_cs,ingredients_text_sk,ingredients_text_sl,additives_tags,allergens_tags
          for c in austria germany bulgaria hungary czech-republic slovakia slovenia; do
            for page in 1 2; do
              curl -sS --fail --retry 3 --max-time 60 -A "label-check-audit (https://github.com/harisonbd/label-check)" \
                "https://world.openfoodfacts.org/api/v2/search?countries_tags_en=$c&page_size=100&page=$page&sort_by=unique_scans_n&fields=$FIELDS" \
                -o "_audit/$c-$page.json" || echo "download failed: $c $page"
              sleep 7   # Open Food Facts asks for at most 10 searches per minute
            done
          done
          ls -la _audit

      - name: Compare
        run: |
          node tools/audit.js _audit audit-report.md
          cat audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.md
